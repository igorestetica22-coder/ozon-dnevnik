<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Дневник отчётов Ozon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: date ledger — header with day navigation, entity switch, KPI strip, then detail panels in two columns */
:root{
  --bg:#F2F4F7;--surface:#FFFFFF;--ink:#16202E;--muted:#5D6878;--line:#DCE1E8;--track:#E7EBF0;
  --accent:#2C5BD0;--accent-soft:#E3EAFB;--accent-ink:#FFFFFF;
  --good:#1D8456;--good-soft:#E0F2E8;--bad:#C0442C;--bad-soft:#F8E3DE;--warn:#A86F0E;
  --c-comm:#7C8BA3;--c-log:#3E8FB0;--c-cost:#A3804F;--c-ads:#C0442C;--c-tax:#8B6CC2;--c-prof:#1D8456;
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0F141B;--surface:#171E28;--ink:#E3E8EF;--muted:#94A0B1;--line:#283241;--track:#222B37;
  --accent:#6E97F2;--accent-soft:#1F2C48;--accent-ink:#0D1320;
  --good:#4FC18A;--good-soft:#173326;--bad:#EE7C62;--bad-soft:#3A221D;--warn:#E0A84A;
  --c-comm:#8E9BB2;--c-log:#5DB0D2;--c-cost:#C9A26E;--c-ads:#EE7C62;--c-tax:#A98CE0;--c-prof:#4FC18A;
}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0F141B;--surface:#171E28;--ink:#E3E8EF;--muted:#94A0B1;--line:#283241;--track:#222B37;
  --accent:#6E97F2;--accent-soft:#1F2C48;--accent-ink:#0D1320;
  --good:#4FC18A;--good-soft:#173326;--bad:#EE7C62;--bad-soft:#3A221D;--warn:#E0A84A;
  --c-comm:#8E9BB2;--c-log:#5DB0D2;--c-cost:#C9A26E;--c-ads:#EE7C62;--c-tax:#A98CE0;--c-prof:#4FC18A;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
h1{font-size:21px;letter-spacing:-.01em}
h2{font-size:14px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.note{font-size:12.5px;color:var(--muted)}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.daytitle{color:var(--muted);font-size:14px;margin-top:3px}
.datenav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;line-height:1}
.iconbtn:hover:not([disabled]){border-color:var(--accent)}
.iconbtn[disabled]{opacity:.4;cursor:default}
.datenav input{padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);min-height:36px}
.pill{padding:0 12px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px}
.pill[disabled]{opacity:.45;cursor:default}

.tabs{display:flex;gap:4px;padding:4px;background:var(--track);border-radius:12px;align-self:flex-start;flex-wrap:wrap}
.tab{border:none;background:transparent;padding:8px 16px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.banner{border-radius:12px;padding:10px 14px;font-size:13px;background:var(--bad-soft);border:1px solid var(--bad)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:28px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi.main{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.kpi .v{font-family:var(--display);font-weight:500;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d{font-size:12px;font-weight:600;white-space:nowrap}
.d.up{color:var(--good)}.d.dn{color:var(--bad)}.d.eq{color:var(--muted)}

.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}

.tablewrap{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:right;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:6px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
tr.model td{font-weight:600;cursor:pointer}
tr.model:hover td{background:var(--accent-soft)}
tr.model td:first-child::before{content:"▸";display:inline-block;width:14px;color:var(--muted);transition:transform .15s}
tr.model.open td:first-child::before{transform:rotate(90deg)}
tr.art td{color:var(--muted);font-size:12.5px}
th.f80,td.f80{background:var(--track)}
th.f80{color:var(--ink)}
table{min-width:860px}
tr.art td:first-child{padding-left:22px}
tr.total td{font-weight:700;border-top:2px solid var(--ink);border-bottom:none}
.neg{color:var(--bad)}
.mchip{display:inline-block;padding:1px 7px;border-radius:7px;font-size:12px;font-weight:600}
.mchip.g{background:var(--good-soft);color:var(--good)}.mchip.y{background:var(--track);color:var(--warn)}.mchip.r{background:var(--bad-soft);color:var(--bad)}

.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10.5px;font-family:var(--body)}
.chart .sel{fill:var(--ink);font-weight:700}

.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--track)}
.stack i{display:block;height:100%}
.legend{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;font-size:13px}
.legend .k{display:flex;align-items:center;gap:7px;color:var(--muted)}
.legend .k i{width:9px;height:9px;border-radius:3px;display:inline-block}
.legend b{font-weight:600;text-align:right}
.legend span.p{color:var(--muted);text-align:right}

.chg{display:flex;flex-direction:column;gap:2px}
.chg-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line);align-items:baseline}
.chg-row:last-child{border-bottom:none}
.chg-row .n{min-width:0;overflow-wrap:anywhere}
.chg-row small{color:var(--muted);font-size:12px;white-space:nowrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.two h3{font-size:12px;margin:0 0 4px;font-weight:600}

.new{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.newc{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.newc b{font-family:var(--display);font-weight:500;font-size:13px}
.newc .q{font-size:20px;font-weight:700}
.newc small{color:var(--muted);font-size:11.5px;overflow-wrap:anywhere}

.both{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.ent h2{margin-bottom:6px}
.erow{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.erow:last-child{border-bottom:none}
.erow span:first-child{color:var(--muted)}

.ctrls{display:flex;gap:10px;flex-wrap:wrap}
.ctrls .tab{padding:6px 12px;font-size:13px}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.week-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.week-legend .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
table.days tr.model td:first-child::before{content:none}
.lock{min-height:100vh;display:grid;place-items:center;padding-block:24px}
.lockcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:10px;width:100%;max-width:380px}
.lockcard input[type=password]{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);min-height:42px}
.rem{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.pill.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);height:42px;font-size:14px}
.notes{display:flex;flex-direction:column;gap:8px;font-size:13px}
.notes p{margin:0}
.notes ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}

@media (max-width:900px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.grid{grid-template-columns:1fr}.new{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis,.kpis.k3{grid-template-columns:repeat(2,minmax(0,1fr))}.two,.both{grid-template-columns:1fr}.new{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){tr.model td:first-child::before{transition:none}}
</style>
</head><body>


<div class="lock" id="lock">
  <form class="lockcard" id="lockForm" autocomplete="off">
    <h1>Дневник отчётов Ozon</h1>
    <p class="note">ИП Warm Hearts и ООО Феникс. Данные зашифрованы — введите пароль.</p>
    <label class="label" for="pw">Пароль</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <label class="rem"><input type="checkbox" id="remember" checked> Запомнить на этом устройстве</label>
    <button class="pill primary" type="submit">Открыть</button>
    <div class="note" id="lockMsg" aria-live="polite"></div>
  </form>
</div>
<div class="wrap" id="app" hidden>
  <header class="top">
    <div>
      <h1>Дневник отчётов Ozon</h1>
      <div class="daytitle" id="dayTitle">Загружаю отчёты…</div>
    </div>
    <div class="datenav">
      <button class="iconbtn" id="prevDay" aria-label="Предыдущий день с отчётом">‹</button>
      <input type="date" id="datePick" aria-label="Выбрать дату">
      <button class="iconbtn" id="nextDay" aria-label="Следующий день с отчётом">›</button>
      <button class="pill" id="lastBtn">Последний</button>
      <button class="pill" id="logout" title="Забыть пароль на этом устройстве">Выйти</button>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Юрлицо">
    <button type="button" role="tab" class="tab" id="tab-WH" data-ent="WH" aria-selected="true">ИП Warm Hearts</button>
    <button type="button" role="tab" class="tab" id="tab-FX" data-ent="FX" aria-selected="false">ООО Феникс</button>
    <button type="button" role="tab" class="tab" id="tab-ALL" data-ent="ALL" aria-selected="false">Оба</button>
    <button type="button" role="tab" class="tab" id="tab-SALES" data-ent="SALES" aria-selected="false">Продажи за период</button>
    <button type="button" role="tab" class="tab" id="tab-MONTH" data-ent="MONTH" aria-selected="false">По месяцам</button>
  </nav>

  <div class="banner" id="banner" hidden></div>
  <div id="main"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const ENT={WH:"ИП Warm Hearts",FX:"ООО Феникс"};
const NEW=["KY6612","KY6613","KY6614","KY6615","KY6616"];
const st={reports:{},dates:[],date:null,ent:"WH",open:new Set(),loaded:false};
try{const e=localStorage.getItem("ozon-ent");if(e&&["WH","FX","ALL","SALES","MONTH"].includes(e))st.ent=e}catch(e){}
st.period="all";st.metric="rev";st.month=null;st.mEnt="ALL";

const fmt=n=>n==null||!isFinite(n)?"—":Math.round(n).toLocaleString("ru-RU");
const pct=(n,d=1)=>n==null||!isFinite(n)?"—":(n*100).toLocaleString("ru-RU",{minimumFractionDigits:d,maximumFractionDigits:d})+"%";
const sgn=(n,f)=>(n>0?"+":n<0?"−":"±")+f(Math.abs(n));
const el=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e};
const fromIso=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const dLabel=s=>fromIso(s).toLocaleDateString("ru-RU",{day:"numeric",month:"short"}).replace(".","");

function combine(a,b){
  if(!a)return b;if(!b)return a;
  const t={};["q","rev","paid","comm","acq","tax","log","cost","ads","profit","frev","fprofit","canc"].forEach(k=>t[k]=(a[k]||0)+(b[k]||0));
  t.spp=t.rev?1-t.paid/t.rev:null;t.m=t.rev?t.profit/t.rev:null;t.fm=t.frev?t.fprofit/t.frev:null;t.drr=t.rev?(-t.ads)/t.rev:null;return t;
}
function totalsFor(date,ent){
  const r=st.reports[date];if(!r)return null;
  if(ent==="ALL")return(r.WH||r.FX)?combine(r.WH&&r.WH.totals,r.FX&&r.FX.totals):null;
  return r[ent]?r[ent].totals:null;
}
function prevDate(date,ent){const i=st.dates.indexOf(date);for(let j=i-1;j>=0;j--){if(totalsFor(st.dates[j],ent))return st.dates[j]}return null}

function delta(cur,prev,key,kind){
  const s=el("span","d eq","");
  if(!prev||prev[key]==null||cur[key]==null){s.textContent="нет прошлого дня";return s}
  let d=cur[key]-prev[key];
  if(kind==="cost"){d=-(cur[key]-prev[key]);}
  const good=kind==="cost"?(cur[key]-prev[key])>0:d>0; // costs are negative numbers: less negative = good
  if(kind==="pp"){s.textContent=sgn(d*100,x=>x.toLocaleString("ru-RU",{maximumFractionDigits:1}))+" п.п.";}
  else if(kind==="cost"){const raw=Math.abs(cur[key])-Math.abs(prev[key]);s.textContent=sgn(raw,fmt)+" ₽";s.className="d "+(raw<0?"up":raw>0?"dn":"eq");return s}
  else{const rel=prev[key]?d/Math.abs(prev[key]):null;s.textContent=sgn(d,fmt)+(kind==="q"?" шт":" ₽")+(rel!=null&&kind!=="q"?" ("+sgn(rel*100,x=>x.toLocaleString("ru-RU",{maximumFractionDigits:1}))+"%)":"");}
  s.className="d "+(d>0?"up":d<0?"dn":"eq");if(kind==="inv")s.className="d "+(d<0?"up":d>0?"dn":"eq");
  return s;
}

function kpi(label,value,sub,dnode,main){
  const k=el("div","kpi"+(main?" main":""));k.append(el("span","label",label),el("div","v",value));if(sub)k.append(el("div","s",sub));if(dnode)k.append(dnode);return k;
}
function mchip(m){const c=el("span","mchip "+(m==null?"y":m>=0.18?"g":m>=0.1?"y":"r"),pct(m));return c}

function render(){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",String(t.dataset.ent===st.ent)));
  const main=$("main");main.textContent="";
  const has=st.dates.length>0;
  $("prevDay").disabled=!has||st.dates.indexOf(st.date)<=0;
  $("nextDay").disabled=!has||st.dates.indexOf(st.date)>=st.dates.length-1;
  $("lastBtn").disabled=!has||st.date===st.dates[st.dates.length-1];
  if(st.date)$("datePick").value=st.date;
  if(has){$("datePick").min=st.dates[0];$("datePick").max=st.dates[st.dates.length-1]}
  if(!st.loaded){$("dayTitle").textContent="Загружаю отчёты…";main.append(emptyBox("Загружаю отчёты","Это займёт пару секунд."));return}
  if(!has){$("dayTitle").textContent="Отчётов пока нет";main.append(emptyBox("Здесь появятся ежедневные отчёты","Попросите Claude в чате «сделай отчёт за вчера», и день добавится сюда."));return}
  if(st.ent==="SALES"){$("dayTitle").textContent="Все дни в дневнике: с "+dLabel(st.dates[0])+" по "+dLabel(st.dates[st.dates.length-1]);main.append(salesView());return}
  if(st.ent==="MONTH"){const mk=st.month||(st.date||"").slice(0,7);$("dayTitle").textContent="Итоги месяца по дням с отчётом";main.append(monthView());return}
  const dt=fromIso(st.date);let title=dt.toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  $("dayTitle").textContent="Заказы за "+title+" (МСК, по дате «Принят в обработку»)";
  const cur=totalsFor(st.date,st.ent);
  if(!cur){main.append(emptyBox("За этот день отчёта нет","Выберите день стрелками или в календаре. Отчёты есть за "+st.dates.length+" "+plural(st.dates.length,"день","дня","дней")+": с "+dLabel(st.dates[0])+" по "+dLabel(st.dates[st.dates.length-1])+"."));return}
  const pd=prevDate(st.date,st.ent),prev=pd?totalsFor(pd,st.ent):null;
  const box=el("div","col");main.append(box);

  // KPIs
  const k=el("div","kpis");
  k.append(
    kpi("Чистая прибыль",fmt(cur.profit)+" ₽","маржа "+pct(cur.m),delta(cur,prev,"profit"),true),
    kpi("Заказано",fmt(cur.q)+" шт",(cur.canc!=null?"отмен "+cur.canc:""),delta(cur,prev,"q","q")),
    kpi("Выручка",fmt(cur.rev)+" ₽","после СПП "+fmt(cur.paid)+" ₽",delta(cur,prev,"rev")),
    kpi("СПП",pct(cur.spp),"скидка Ozon",delta(cur,prev,"spp","pp")),
    kpi("Реклама",fmt(Math.abs(cur.ads))+" ₽","ДРР "+pct(cur.drr),delta(cur,prev,"ads","cost")),
    kpi("Прогноз при выкупе 80%",fmt(cur.fprofit)+" ₽","маржа "+pct(cur.fm),delta(cur,prev,"fprofit"))
  );
  box.append(k);
  if(pd){const n=el("div","note","Сравнение с "+dLabel(pd)+(st.ent==="ALL"?" (сумма двух кабинетов)":"")+". Рентабельность от цены после СПП: "+pct(cur.paid?cur.profit/cur.paid:null)+".");box.append(n)}

  if(st.ent==="ALL"){box.append(bothView());return}

  const rep=st.reports[st.date][st.ent];const prep=pd?st.reports[pd][st.ent]:null;
  const g=el("div","grid");const left=el("div","col"),right=el("div","col");g.append(left,right);box.append(g);
  left.append(modelTable(rep,prep));
  if(st.ent==="FX")left.append(newItems(rep,prep));
  left.append(changes(rep,prep,pd));
  right.append(trendChart(),costBreakdown(cur),notes(rep));
}
function plural(n,a,b,c){n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c}
function emptyBox(t,s){const e=el("div","empty");e.append(el("b",null,t),el("span",null,s));return e}

function modelTable(rep,prep){
  const p=el("section","panel");const h=el("div","panel-head");h.append(el("h2",null,"Модели и размеры"),el("span","label","нажмите на модель, чтобы раскрыть"));p.append(h);
  p.append(el("div","note","Серые столбцы справа — прогноз при выкупе 80%: «Доставлен» берётся на 100%, остальные заказы на 80% (с себестоимостью), плюс обратная логистика 65,29 ₽/шт на невыкуп. Реклама и прямая логистика не уменьшаются."));
  const pm={};const pa={};if(prep)prep.models.forEach(m=>{pm[m.name]=m;m.arts.forEach(a=>pa[a.name]=a)});
  const wrap=el("div","tablewrap");const t=el("table");wrap.append(t);p.append(wrap);

    kpi("Прогноз при выкупе 80%",fmt(t.fprofit)+" ₽","маржа "+pct(t.fm),dd("fprofit"))
  );
  w.append(k);
  let note="В месяце "+a.n+" "+plural(a.n,"день","дня","дней")+" с отчётом из "+dim+". В среднем в день: прибыль "+fmt(av.profit)+" ₽, выручка "+fmt(av.rev)+" ₽.";
  if(!full)note+=" Если темп сохранится, за весь месяц: выручка ≈ "+fmt(av.rev*dim)+" ₽, прибыль ≈ "+fmt(av.profit*dim)+" ₽, при выкупе 80% ≈ "+fmt(av.fprofit*dim)+" ₽.";
  note+=pav?" Изменения под цифрами — среднее в день к "+mLabel(months[pi]).toLowerCase()+" ("+pa.n+" "+plural(pa.n,"день","дня","дней")+"), чтобы неполные месяцы сравнивались честно.":"";
  note+=" Рентабельность от цены после СПП: "+pct(t.paid?t.profit/t.paid:null)+".";
  w.append(el("div","note",note));
  const g=el("div","grid");const left=el("div","col"),right=el("div","col");g.append(left,right);w.append(g);
  const mt=modelTable({models:a.models,totals:cur},null);mt.querySelector("h2").textContent="Модели и размеры за месяц";left.append(mt);
  // days table
  const tp=el("section","panel");tp.append(el("h2",null,"Дни месяца"));const wrap=el("div","tablewrap");const tb0=el("table","days");wrap.append(tb0);tp.append(wrap);
  const hr=el("tr");["День","Шт","Выручка","СПП","Реклама","Прибыль","Маржа","Прибыль 80%"].forEach(x=>hr.append(el("th",null,x)));const th=el("thead");th.append(hr);tb0.append(th);
  const tb=el("tbody");tb0.append(tb);
  a.days.slice().reverse().forEach(({d,t})=>{const tr=el("tr","model");tr.tabIndex=0;const go=()=>{st.date=d;setEnt(st.mEnt)};tr.addEventListener("click",go);tr.addEventListener("keydown",e=>{if(e.key==="Enter"){go()}});
    tr.append(el("td",null,fromIso(d).toLocaleDateString("ru-RU",{weekday:"short",day:"numeric",month:"short"})),el("td",null,fmt(t.q)),el("td",null,fmt(t.rev)),el("td",null,pct(t.spp,0)),el("td",null,fmt(Math.abs(t.ads))),el("td",t.profit<0?"neg":null,fmt(t.profit)));
    const m=el("td");m.append(mchip(t.m));tr.append(m,el("td","f80",fmt(t.fprofit)));tb.append(tr)});
  const tr=el("tr","total");tr.append(el("td",null,"ИТОГО"),el("td",null,fmt(t.q)),el("td",null,fmt(t.rev)),el("td",null,pct(t.spp,0)),el("td",null,fmt(Math.abs(t.ads))),el("td",null,fmt(t.profit)));const m=el("td");m.append(mchip(t.m));tr.append(m,el("td","f80",fmt(t.fprofit)));tb.append(tr);
  tp.append(el("div","note","Нажмите на день, чтобы открыть его отчёт."));
  left.append(tp);
  right.append(costBreakdown(cur));
  // months comparison
  const mp=el("section","panel");mp.append(el("h2",null,"Все месяцы"));
  months.slice().reverse().forEach(mk=>{const x=monthAgg(mk,st.mEnt);if(!x)return;const r=el("div","erow");const b=el("button","pill",mLabel(mk));b.style.whiteSpace="nowrap";b.addEventListener("click",()=>{st.month=mk;render()});
    const s=el("span",null,fmt(x.totals.rev)+" ₽ · прибыль "+fmt(x.totals.profit)+" ₽ · "+x.n+" дн.");r.append(b,s);mp.append(r)});
  right.append(mp);
  return w;
}

const LOCK=$("lock");
function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function decrypt(pw){
  const r=await fetch("data.enc.json",{cache:"no-store"});if(!r.ok)throw new Error("net");
  const e=await r.json();
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(e.salt),iterations:e.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  let buf;try{buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(e.iv)},key,b64(e.ct))}catch(x){throw new Error("pw")}
  if(e.gz){buf=await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer()}
  return JSON.parse(new TextDecoder().decode(buf));
}
function load(docs){const rep={};docs.forEach(v=>{if(v&&v.date&&v.entity&&v.totals){(rep[v.date]=rep[v.date]||{})[v.entity]=v}});
  st.reports=rep;st.dates=Object.keys(rep).sort();st.loaded=true;st.date=st.dates[st.dates.length-1]||null;render()}
async function unlock(pw,remember){
  const msg=$("lockMsg");msg.textContent="Проверяю пароль…";
  try{const docs=await decrypt(pw);if(remember){try{localStorage.setItem("ozon-pw",pw)}catch(e){}}LOCK.hidden=true;$("app").hidden=false;load(docs)}
  catch(e){msg.textContent=e.message==="pw"?"Неверный пароль. Проверьте раскладку и попробуйте ещё раз.":"Не удалось загрузить данные. Проверьте интернет и обновите страницу.";try{localStorage.removeItem("ozon-pw")}catch(x){}}
}
$("lockForm").addEventListener("submit",e=>{e.preventDefault();unlock($("pw").value.trim(),$("remember").checked)});
$("logout").addEventListener("click",()=>{try{localStorage.removeItem("ozon-pw")}catch(e){}location.reload()});
(function(){let s=null;try{s=localStorage.getItem("ozon-pw")}catch(e){}if(s)unlock(s,true)})();
